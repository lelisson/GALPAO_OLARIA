name: Manter painel ativo

on:
  schedule:
    # Limite ToS: no máximo 1×/dia. Preferir UptimeRobot fora do Actions.
    - cron: "50 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manter-ativo
  cancel-in-progress: true

jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install playwright && python -m playwright install --with-deps chromium

      - run: python scripts/manter_ativo.py
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
